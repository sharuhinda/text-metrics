[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-metrics"
version = "0.1.0"
description = "Batch English-text perplexity and lemma-based lexical entropy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stanza>=1.9,<2",
    "transformers>=4.45,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
text-metrics = "text_metrics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
